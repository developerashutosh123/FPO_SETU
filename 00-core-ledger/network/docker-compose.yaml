# FPO-SETU Fabric network, FULL profile: 3 Raft orderers, 4 peers (LevelDB), 5 CAs. Images pinned in VERSIONS.md.
# Crypto material is created by scripts/enroll.sh through the CAs and mounted read-only. Ledger data lives in named volumes.
name: fposetu

x-fabric-tag: &fabric_tag 2.5.16
x-ca-tag: &ca_tag 1.5.22

networks:
  net:
    name: fposetu_net

volumes:
  ca-fpo: {}
  ca-bank: {}
  ca-buyer: {}
  ca-regulator: {}
  ca-orderer: {}
  orderer1-data: {}
  orderer2-data: {}
  orderer3-data: {}
  peer0-fpo-data: {}
  peer0-bank-data: {}
  peer0-buyer-data: {}
  peer0-regulator-data: {}

x-ca: &ca
  image: hyperledger/fabric-ca:1.5.22
  networks: [net]
  restart: unless-stopped
  command: sh -c 'fabric-ca-server start -b admin:$${CA_ADMIN_PW}'
  deploy: { resources: { limits: { memory: 128M, cpus: "0.5" } } }
  environment: &ca_env
    FABRIC_CA_HOME: /etc/hyperledger/fabric-ca-server
    FABRIC_CA_SERVER_TLS_ENABLED: "true"
    CA_ADMIN_PW: ${CA_ADMIN_PW:?run scripts/network.sh up}

x-orderer: &orderer
  image: hyperledger/fabric-orderer:2.5.16
  networks: [net]
  restart: unless-stopped
  command: orderer
  working_dir: /root
  deploy: { resources: { limits: { memory: 384M, cpus: "1.0" } } }
  environment: &orderer_env
    FABRIC_LOGGING_SPEC: INFO
    ORDERER_GENERAL_LISTENADDRESS: 0.0.0.0
    ORDERER_GENERAL_LISTENPORT: 7050
    ORDERER_GENERAL_LOCALMSPID: OrdererOrgMSP
    ORDERER_GENERAL_LOCALMSPDIR: /var/hyperledger/orderer/msp
    ORDERER_GENERAL_TLS_ENABLED: "true"
    ORDERER_GENERAL_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
    ORDERER_GENERAL_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
    ORDERER_GENERAL_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    ORDERER_GENERAL_CLUSTER_CLIENTCERTIFICATE: /var/hyperledger/orderer/tls/server.crt
    ORDERER_GENERAL_CLUSTER_CLIENTPRIVATEKEY: /var/hyperledger/orderer/tls/server.key
    ORDERER_GENERAL_CLUSTER_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    ORDERER_GENERAL_BOOTSTRAPMETHOD: none
    ORDERER_CHANNELPARTICIPATION_ENABLED: "true"
    ORDERER_ADMIN_TLS_ENABLED: "true"
    ORDERER_ADMIN_TLS_CERTIFICATE: /var/hyperledger/orderer/tls/server.crt
    ORDERER_ADMIN_TLS_PRIVATEKEY: /var/hyperledger/orderer/tls/server.key
    ORDERER_ADMIN_TLS_ROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    ORDERER_ADMIN_TLS_CLIENTROOTCAS: "[/var/hyperledger/orderer/tls/ca.crt]"
    ORDERER_METRICS_PROVIDER: prometheus

x-peer: &peer
  image: hyperledger/fabric-peer:2.5.16
  networks: [net]
  restart: unless-stopped
  working_dir: /root
  command: peer node start
  deploy: { resources: { limits: { memory: 1G, cpus: "1.5" } } }
  environment: &peer_env
    FABRIC_CFG_PATH: /etc/hyperledger/peercfg
    FABRIC_LOGGING_SPEC: INFO
    CORE_PEER_TLS_ENABLED: "true"
    CORE_PEER_TLS_CERT_FILE: /etc/hyperledger/fabric/tls/server.crt
    CORE_PEER_TLS_KEY_FILE: /etc/hyperledger/fabric/tls/server.key
    CORE_PEER_TLS_ROOTCERT_FILE: /etc/hyperledger/fabric/tls/ca.crt
    CORE_PEER_MSPCONFIGPATH: /etc/hyperledger/fabric/msp
    CORE_PEER_PROFILE_ENABLED: "false"
    CORE_LEDGER_STATE_STATEDATABASE: goleveldb
    CORE_PEER_GOSSIP_USELEADERELECTION: "true"
    CORE_PEER_GOSSIP_ORGLEADER: "false"
    CORE_VM_ENDPOINT: unix:///host/var/run/docker.sock
    CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE: fposetu_net
    CORE_CHAINCODE_BUILDER: hyperledger/fabric-ccenv:2.5.16
    CORE_CHAINCODE_GOLANG_RUNTIME: hyperledger/fabric-baseos:2.5.16
    CORE_METRICS_PROVIDER: prometheus
    CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9444

services:
  # ---------------------------------------------------------------- certificate authorities (one per org)
  ca.fpo.setu.local:
    <<: *ca
    container_name: ca.fpo.setu.local
    environment: { <<: *ca_env, FABRIC_CA_SERVER_CA_NAME: ca-fpo, FABRIC_CA_SERVER_PORT: 7054, FABRIC_CA_SERVER_CSR_HOSTS: "ca.fpo.setu.local,localhost", FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS: "0.0.0.0:17054" }
    ports: ["127.0.0.1:7054:7054"]
    volumes: ["ca-fpo:/etc/hyperledger/fabric-ca-server"]
  ca.bank.setu.local:
    <<: *ca
    container_name: ca.bank.setu.local
    environment: { <<: *ca_env, FABRIC_CA_SERVER_CA_NAME: ca-bank, FABRIC_CA_SERVER_PORT: 8054, FABRIC_CA_SERVER_CSR_HOSTS: "ca.bank.setu.local,localhost", FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS: "0.0.0.0:18054" }
    ports: ["127.0.0.1:8054:8054"]
    volumes: ["ca-bank:/etc/hyperledger/fabric-ca-server"]
  ca.buyer.setu.local:
    <<: *ca
    container_name: ca.buyer.setu.local
    environment: { <<: *ca_env, FABRIC_CA_SERVER_CA_NAME: ca-buyer, FABRIC_CA_SERVER_PORT: 9054, FABRIC_CA_SERVER_CSR_HOSTS: "ca.buyer.setu.local,localhost", FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS: "0.0.0.0:19054" }
    ports: ["127.0.0.1:9054:9054"]
    volumes: ["ca-buyer:/etc/hyperledger/fabric-ca-server"]
  ca.regulator.setu.local:
    <<: *ca
    container_name: ca.regulator.setu.local
    environment: { <<: *ca_env, FABRIC_CA_SERVER_CA_NAME: ca-regulator, FABRIC_CA_SERVER_PORT: 10054, FABRIC_CA_SERVER_CSR_HOSTS: "ca.regulator.setu.local,localhost", FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS: "0.0.0.0:20054" }
    ports: ["127.0.0.1:10054:10054"]
    volumes: ["ca-regulator:/etc/hyperledger/fabric-ca-server"]
  ca.orderer.setu.local:
    <<: *ca
    container_name: ca.orderer.setu.local
    environment: { <<: *ca_env, FABRIC_CA_SERVER_CA_NAME: ca-orderer, FABRIC_CA_SERVER_PORT: 11054, FABRIC_CA_SERVER_CSR_HOSTS: "ca.orderer.setu.local,localhost", FABRIC_CA_SERVER_OPERATIONS_LISTENADDRESS: "0.0.0.0:21054" }
    ports: ["127.0.0.1:11054:11054"]
    volumes: ["ca-orderer:/etc/hyperledger/fabric-ca-server"]

  # ---------------------------------------------------------------- orderers (Raft, 3 consenters)
  orderer1.setu.local:
    <<: *orderer
    container_name: orderer1.setu.local
    ports: ["127.0.0.1:7050:7050", "127.0.0.1:7053:7053", "127.0.0.1:9443:9443"]
    environment: { <<: *orderer_env, ORDERER_ADMIN_LISTENADDRESS: "0.0.0.0:7053", ORDERER_OPERATIONS_LISTENADDRESS: "0.0.0.0:9443" }
    volumes:
      - ./organizations/ordererOrganizations/setu.local/orderers/orderer1.setu.local/msp:/var/hyperledger/orderer/msp:ro
      - ./organizations/ordererOrganizations/setu.local/orderers/orderer1.setu.local/tls:/var/hyperledger/orderer/tls:ro
      - orderer1-data:/var/hyperledger/production/orderer
  orderer2.setu.local:
    <<: *orderer
    container_name: orderer2.setu.local
    ports: ["127.0.0.1:8050:7050", "127.0.0.1:8053:7053", "127.0.0.1:9453:9443"]
    environment: { <<: *orderer_env, ORDERER_ADMIN_LISTENADDRESS: "0.0.0.0:7053", ORDERER_OPERATIONS_LISTENADDRESS: "0.0.0.0:9443" }
    volumes:
      - ./organizations/ordererOrganizations/setu.local/orderers/orderer2.setu.local/msp:/var/hyperledger/orderer/msp:ro
      - ./organizations/ordererOrganizations/setu.local/orderers/orderer2.setu.local/tls:/var/hyperledger/orderer/tls:ro
      - orderer2-data:/var/hyperledger/production/orderer
  orderer3.setu.local:
    <<: *orderer
    container_name: orderer3.setu.local
    ports: ["127.0.0.1:9050:7050", "127.0.0.1:9053:7053", "127.0.0.1:9463:9443"]
    environment: { <<: *orderer_env, ORDERER_ADMIN_LISTENADDRESS: "0.0.0.0:7053", ORDERER_OPERATIONS_LISTENADDRESS: "0.0.0.0:9443" }
    volumes:
      - ./organizations/ordererOrganizations/setu.local/orderers/orderer3.setu.local/msp:/var/hyperledger/orderer/msp:ro
      - ./organizations/ordererOrganizations/setu.local/orderers/orderer3.setu.local/tls:/var/hyperledger/orderer/tls:ro
      - orderer3-data:/var/hyperledger/production/orderer

  # ---------------------------------------------------------------- peers (one per org, LevelDB)
  peer0.fpo.setu.local:
    <<: *peer
    container_name: peer0.fpo.setu.local
    environment:
      <<: *peer_env
      CORE_PEER_ID: peer0.fpo.setu.local
      CORE_PEER_ADDRESS: peer0.fpo.setu.local:7051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:7051
      CORE_PEER_CHAINCODEADDRESS: peer0.fpo.setu.local:7052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:7052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.fpo.setu.local:7051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.fpo.setu.local:7051
      CORE_PEER_LOCALMSPID: FpoOrgMSP
    ports: ["127.0.0.1:7051:7051", "127.0.0.1:9444:9444"]
    volumes: &fpo_vols
      - ./organizations/peerOrganizations/fpo.setu.local/peers/peer0.fpo.setu.local/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/fpo.setu.local/peers/peer0.fpo.setu.local/tls:/etc/hyperledger/fabric/tls:ro
      - ./.fabric-install/config:/etc/hyperledger/peercfg:ro
      - peer0-fpo-data:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
  peer0.bank.setu.local:
    <<: *peer
    container_name: peer0.bank.setu.local
    environment:
      <<: *peer_env
      CORE_PEER_ID: peer0.bank.setu.local
      CORE_PEER_ADDRESS: peer0.bank.setu.local:9051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:9051
      CORE_PEER_CHAINCODEADDRESS: peer0.bank.setu.local:9052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:9052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.bank.setu.local:9051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.bank.setu.local:9051
      CORE_PEER_LOCALMSPID: BankOrgMSP
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9445
    ports: ["127.0.0.1:9051:9051", "127.0.0.1:9445:9445"]
    volumes:
      - ./organizations/peerOrganizations/bank.setu.local/peers/peer0.bank.setu.local/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/bank.setu.local/peers/peer0.bank.setu.local/tls:/etc/hyperledger/fabric/tls:ro
      - ./.fabric-install/config:/etc/hyperledger/peercfg:ro
      - peer0-bank-data:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
  peer0.buyer.setu.local:
    <<: *peer
    container_name: peer0.buyer.setu.local
    environment:
      <<: *peer_env
      CORE_PEER_ID: peer0.buyer.setu.local
      CORE_PEER_ADDRESS: peer0.buyer.setu.local:11051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:11051
      CORE_PEER_CHAINCODEADDRESS: peer0.buyer.setu.local:11052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:11052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.buyer.setu.local:11051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.buyer.setu.local:11051
      CORE_PEER_LOCALMSPID: BuyerOrgMSP
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9446
    ports: ["127.0.0.1:11051:11051", "127.0.0.1:9446:9446"]
    volumes:
      - ./organizations/peerOrganizations/buyer.setu.local/peers/peer0.buyer.setu.local/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/buyer.setu.local/peers/peer0.buyer.setu.local/tls:/etc/hyperledger/fabric/tls:ro
      - ./.fabric-install/config:/etc/hyperledger/peercfg:ro
      - peer0-buyer-data:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
  peer0.regulator.setu.local:
    <<: *peer
    container_name: peer0.regulator.setu.local
    environment:
      <<: *peer_env
      CORE_PEER_ID: peer0.regulator.setu.local
      CORE_PEER_ADDRESS: peer0.regulator.setu.local:13051
      CORE_PEER_LISTENADDRESS: 0.0.0.0:13051
      CORE_PEER_CHAINCODEADDRESS: peer0.regulator.setu.local:13052
      CORE_PEER_CHAINCODELISTENADDRESS: 0.0.0.0:13052
      CORE_PEER_GOSSIP_BOOTSTRAP: peer0.regulator.setu.local:13051
      CORE_PEER_GOSSIP_EXTERNALENDPOINT: peer0.regulator.setu.local:13051
      CORE_PEER_LOCALMSPID: RegulatorOrgMSP
      CORE_OPERATIONS_LISTENADDRESS: 0.0.0.0:9447
    ports: ["127.0.0.1:13051:13051", "127.0.0.1:9447:9447"]
    volumes:
      - ./organizations/peerOrganizations/regulator.setu.local/peers/peer0.regulator.setu.local/msp:/etc/hyperledger/fabric/msp:ro
      - ./organizations/peerOrganizations/regulator.setu.local/peers/peer0.regulator.setu.local/tls:/etc/hyperledger/fabric/tls:ro
      - ./.fabric-install/config:/etc/hyperledger/peercfg:ro
      - peer0-regulator-data:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
