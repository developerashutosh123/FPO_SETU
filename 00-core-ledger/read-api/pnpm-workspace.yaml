# Vercel installs with CI=1, and pnpm then fails with ERR_PNPM_IGNORED_BUILDS for any dependency whose build script is not approved.
# This pnpm (12.x) reads the approval from here (allowBuilds), not from package.json's pnpm.onlyBuiltDependencies.
# esbuild (vitest) and protobufjs (@grpc/proto-loader, pulled in by @hyperledger/fabric-protos) are approved; their scripts are harmless.
# pkcs11js is no longer installed at all: the read-only API does not depend on the Fabric SDK (only on fabric-protos types).
# This file also makes read-api its own pnpm root, so it installs standalone from its own pnpm-lock.yaml.
allowBuilds:
  esbuild: true
  protobufjs: true
