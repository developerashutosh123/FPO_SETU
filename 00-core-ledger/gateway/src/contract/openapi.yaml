  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Claims: {sub, username, role, org, displayName, portal}"
  headers:
    XLedgerMode:
      description: live, or index-only when served by the read-only fallback API.
      schema:
        type: string
        enum:
          - live
          - index-only
  schemas:
    AcceptCustodyResponse:
      $ref: "#/components/schemas/Receipted_LotPassport"
    AcceptQualityRequest:
      type: object
      properties:
        accepted:
          type: boolean
        notes:
          type: string
      required:
        - accepted
      additionalProperties: false
    AcceptQualityResponse:
      $ref: "#/components/schemas/Receipted_Order"
    AdapterMode:
      type: string
      enum:
        - simulated
        - live
    AgreePriceRequest:
      type: object
      properties:
        pricePerQtl:
          type: number
        salt:
          type: string
      required:
        - pricePerQtl
      additionalProperties: false
      description: "`priceHash = sha256Hex(canonicalJson({orderId, pricePerQtl, salt}))`. Both parties submit it; the call commits when both hashes match. If `salt` is omitted the gateway derives it: first 32 hex chars of HMAC-SHA256(PRICE_SALT_SECRET, orderId). Both submissions then agree without sharing a salt out of band."
    AgreePriceResponse:
      $ref: "#/components/schemas/Receipted_PriceAgreementState"
    AnchorConditionDigestResponse:
      $ref: "#/components/schemas/Receipted_LotPassport"
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              $ref: "#/components/schemas/ErrorCode"
            message:
              type: string
            txId:
              type: string
            details: {}
          required:
            - code
            - message
          additionalProperties: false
      required:
        - error
      additionalProperties: false
    AttestorReputation:
      type: object
      properties:
        attestor:
          type: string
        kind:
          type: string
          enum:
            - FACILITY
            - DEVICE
            - OPERATOR
        score:
          type: number
        attestations:
          type: number
        divergences:
          type: number
      required:
        - attestor
        - kind
        - score
        - attestations
        - divergences
      additionalProperties: false
    AttestorReputationResponse:
      type: array
      items:
        $ref: "#/components/schemas/AttestorReputation"
    AttestQualityResponse:
      $ref: "#/components/schemas/Receipted_LotPassport"
    AuditItem:
      type: object
      properties:
