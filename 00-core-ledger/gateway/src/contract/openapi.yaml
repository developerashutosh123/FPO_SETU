            additionalProperties: false
        attestorReputation:
          type: array
          items:
            type: object
            properties:
              attestor:
                type: string
              score:
                type: number
            required:
              - attestor
              - score
            additionalProperties: false
        cgsNpfEligible:
          type: boolean
        cgsNpfReason:
          type: string
      required:
