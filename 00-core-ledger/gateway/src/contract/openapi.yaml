        - enwr
        - repository
        - facilityName
        - quantityQtl
        - assessedValue
        - priceBasis
        - haircutPct
        - ltvPct
        - eligibleLoan
        - lien
        - storageConditionHistory
        - attestorReputation
        - cgsNpfEligible
        - cgsNpfReason
      additionalProperties: false
      description: assessedValue = quantityQtl x priceBasis.modalPerQtl x (1 - haircutPct/100). eligibleLoan = assessedValue x ltvPct/100.
