<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- Fonts (CONTRACT.md section 10): Inter, IBM Plex Mono, Noto Sans Bengali, Noto Sans Devanagari. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap" />
    <style id="expo-reset">
      html { background: #EFEADD; scrollbar-width: thin; scrollbar-color: #B9C7AE #EFEADD; }
      body { margin: 0; min-height: 100vh; background: #EFEADD; }
      #root { display: flex; flex-direction: column; min-height: 100vh; }
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: #EFEADD; }
      ::-webkit-scrollbar-thumb { background: #B9C7AE; border-radius: 999px; border: 2px solid #EFEADD; }
      ::-webkit-scrollbar-thumb:hover { background: #1E4D2B; }
    </style>
  </head>
  <body>
    <noscript>This app needs JavaScript.</noscript>
    <div id="root"></div>
  </body>
</html>
